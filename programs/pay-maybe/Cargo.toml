[package]
name = "pay-maybe"
version = "0.1.0"
description = "PayMaybe: Buy Now, Pay Maybe — gamified confidential checkout on Solana + MagicBlock"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pay_maybe"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "0.18", features = ["anchor", "access-control", "vrf"] }

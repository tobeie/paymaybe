[package]
name = "pay-maybe"
version = "0.1.0"
description = "PayMaybe: Buy Now, Pay Maybe — gamified confidential checkout on Solana + MagicBlock"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pay_maybe"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "0.18", features = ["anchor", "access-control", "vrf"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

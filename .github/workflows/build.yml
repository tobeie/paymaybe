name: PayMaybe Build (Anchor & Solana)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-program:
    name: Build Anchor On-Chain Program
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Anchor & Solana Environment
        uses: metadaoproject/setup-anchor@v3.3
        with:
          anchor-version: "0.30.1"
          solana-version: "1.18.26"

      - name: Verify Versions
        run: |
          solana --version
          anchor --version

      - name: Build Anchor Program
        run: |
          anchor build

      - name: Upload Compiled Program (.so)
        uses: actions/upload-artifact@v4
        with:
          name: pay_maybe-program-binary
          path: target/deploy/pay_maybe.so
          if-no-files-found: warn

      - name: Upload Program IDL (JSON)
        uses: actions/upload-artifact@v4
        with:
          name: pay_maybe-idl
          path: target/idl/pay_maybe.json
          if-no-files-found: warn

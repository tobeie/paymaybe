name: Deploy PayMaybe to Solana Devnet & Run Milestone 0 Probe

on:
  workflow_dispatch:
    inputs:
      run_probe:
        description: "Run live Milestone 0 Devnet + MagicBlock TEE/VRF & Security probe after deploy"
        required: false
        default: true
        type: boolean
      sync_idl:
        description: "Commit generated pay_maybe.json IDL into frontend/src/idl and client/src/idl"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  PROGRAM_ID: BxHVeQ7R5LuPLnoL6ySbiDstPChxJcEgPjoHCWgo2erX

jobs:
  deploy-and-probe:
    name: Build, Sync IDL, Upgrade Devnet & Run Live Probe
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Linux System Dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config build-essential libudev-dev

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0

      - name: Cache Cargo Registry and Target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-anchor-1.0.2-${{ hashFiles('programs/**/Cargo.toml', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-anchor-1.0.2-

      - name: Install Solana (Agave 3.1.9)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.9/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Prebuilt Anchor 1.0.2 Binary
        run: |
          sudo curl -sSfL "https://github.com/solana-foundation/anchor/releases/download/v1.0.2/anchor-1.0.2-x86_64-unknown-linux-gnu" -o /usr/local/bin/anchor
          sudo chmod +x /usr/local/bin/anchor

      - name: Load Required Devnet Deployer Wallet
        id: wallet
        env:
          DEVNET_DEPLOYER_KEYPAIR: ${{ secrets.DEVNET_DEPLOYER_KEYPAIR }}
        run: |
          if [ -z "$DEVNET_DEPLOYER_KEYPAIR" ]; then
            echo "::error::Missing required GitHub Secret DEVNET_DEPLOYER_KEYPAIR. Refusing to deploy with an ephemeral throwaway wallet whose upgrade authority would be permanently lost."
            exit 1
          fi

          mkdir -p ~/.config/solana
          printf '%s' "$DEVNET_DEPLOYER_KEYPAIR" > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json
          solana config set --url devnet

          PUBKEY=$(solana-keygen pubkey ~/.config/solana/id.json)
          BALANCE=$(solana balance "$PUBKEY" --url devnet | awk '{print $1}')
          echo "pubkey=$PUBKEY" >> $GITHUB_OUTPUT
          echo "balance=$BALANCE" >> $GITHUB_OUTPUT
          echo "Deployer / Upgrade Authority: $PUBKEY ($BALANCE SOL)"

          ENOUGH=$(awk -v b="$BALANCE" 'BEGIN { print (b >= 0.5) ? 1 : 0 }')
          if [ "$ENOUGH" -ne 1 ]; then
            echo "::error::Insufficient Devnet SOL ($BALANCE SOL < 0.5 SOL). Fund $PUBKEY via https://faucet.solana.com before re-running."
            exit 1
          fi

      - name: Build Anchor Program (.so + IDL)
        run: |
          mkdir -p frontend/src/idl client/src/idl
          anchor build
          cp target/idl/pay_maybe.json frontend/src/idl/pay_maybe.json
          cp target/idl/pay_maybe.json client/src/idl/pay_maybe.json
          ls -lh target/deploy/pay_maybe.so target/idl/pay_maybe.json

      - name: Upload Compiled Program (.so) & IDL
        uses: actions/upload-artifact@v4
        with:
          name: pay_maybe-devnet-artifacts
          path: |
            target/deploy/pay_maybe.so
            target/idl/pay_maybe.json

      - name: Sync Generated IDL to Frontend & Client
        if: ${{ inputs.sync_idl != false }}
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f frontend/src/idl/pay_maybe.json client/src/idl/pay_maybe.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync compiled Anchor 1.0.2 IDL (pay_maybe.json) [skip ci]"
            git push origin HEAD:main
          else
            echo "IDL already up to date."
          fi

      - name: Upgrade pay_maybe.so on Solana Devnet
        id: deploy
        run: |
          echo "Upgrading Program ID: $PROGRAM_ID"
          SO_BYTES=$(stat -c%s target/deploy/pay_maybe.so)
          MAX_SO_BYTES=$(node -e '
            (async () => {
              const rpc = "https://api.devnet.solana.com";
              const post = (m, p) => fetch(rpc, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: m, params: p }) }).then(r => r.json());
              const p = await post("getAccountInfo", [process.env.PROGRAM_ID, { encoding: "base64" }]);
              if (!p.result?.value) { console.log(0); return; }
              const pBuf = Buffer.from(p.result.value.data[0], "base64");
              const B58 = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
              const toB58 = (bytes) => {
                let digits = [0];
                for (const b of bytes) {
                  let carry = b;
                  for (let j = 0; j < digits.length; ++j) { carry += digits[j] << 8; digits[j] = carry % 58; carry = (carry / 58) | 0; }
                  while (carry > 0) { digits.push(carry % 58); carry = (carry / 58) | 0; }
                }
                let str = "";
                for (let k = 0; bytes[k] === 0 && k < bytes.length - 1; ++k) str += "1";
                for (let q = digits.length - 1; q >= 0; --q) str += B58[digits[q]];
                return str;
              };
              const pdAddr = toB58(pBuf.subarray(4, 36));
              const pd = await post("getAccountInfo", [pdAddr, { encoding: "base64", dataSlice: { offset: 0, length: 0 } }]);
              const space = await fetch(rpc, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ jsonrpc: "2.0", id: 2, method: "getAccountInfo", params: [pdAddr, { encoding: "jsonParsed" }] }) }).then(r => r.json());
              const full = await post("getAccountInfo", [pdAddr, { encoding: "base64" }]);
              const len = full.result?.value ? Buffer.from(full.result.value.data[0], "base64").length : 0;
              console.log(Math.max(0, len - 45));
            })();
          ')
          echo "Compiled .so size: $SO_BYTES bytes | On-chain max .so capacity: $MAX_SO_BYTES bytes"
          if [ "$MAX_SO_BYTES" -gt 0 ] && [ "$SO_BYTES" -gt "$MAX_SO_BYTES" ]; then
            EXTRA=$(( SO_BYTES - MAX_SO_BYTES + 32768 ))
            echo "Extending ProgramData by $EXTRA bytes (+32 KB headroom)..."
            solana program extend "$PROGRAM_ID" "$EXTRA" \
              --keypair ~/.config/solana/id.json \
              --url devnet
          fi

          solana program deploy target/deploy/pay_maybe.so \
            --program-id "$PROGRAM_ID" \
            --keypair ~/.config/solana/id.json \
            --url devnet
          echo "program_id=$PROGRAM_ID" >> $GITHUB_OUTPUT
          solana program show "$PROGRAM_ID" --url devnet

      - name: Run Live Milestone 0 Devnet + MagicBlock TEE/VRF & Security Probe
        if: ${{ inputs.run_probe != false }}
        working-directory: client
        env:
          PROGRAM_ID: ${{ env.PROGRAM_ID }}
          PAYER_KEYPAIR_PATH: /home/runner/.config/solana/id.json
        run: |
          npm install --legacy-peer-deps
          npm run probe

      - name: Write Deployment Summary
        if: always()
        run: |
          echo "## PayMaybe Devnet Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Program ID:** \`${{ env.PROGRAM_ID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Explorer:** https://explorer.solana.com/address/${{ env.PROGRAM_ID }}?cluster=devnet" >> $GITHUB_STEP_SUMMARY
          echo "- **Upgrade Authority:** \`${{ steps.wallet.outputs.pubkey }}\` (${{ steps.wallet.outputs.balance }} SOL)" >> $GITHUB_STEP_SUMMARY
